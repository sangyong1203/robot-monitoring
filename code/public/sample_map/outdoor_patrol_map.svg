<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
    <style>
        .bg { fill: #080c14; }
        .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
        .fence { fill: rgba(34, 197, 94, 0.04); stroke: #22c55e; stroke-width: 3; }
        .route { fill: none; stroke: #22c55e; stroke-width: 3; stroke-dasharray: 8 6; stroke-linejoin: round; }
        .post { fill: rgba(15, 23, 42, 0.8); stroke: #16a34a; stroke-width: 1.5; }
        .title { fill: #22c55e; font-family: sans-serif; font-size: 18px; font-weight: 700; }
        .sub { fill: #94a3b8; font-family: sans-serif; font-size: 13px; }
        .wp { fill: #22c55e; stroke: #080c14; stroke-width: 2; }
    </style>

    <rect class="bg" width="1600" height="500" />
    
    <g class="grid">
        <line x1="200" y1="0" x2="200" y2="500" /><line x1="400" y1="0" x2="400" y2="500" />
        <line x1="600" y1="0" x2="600" y2="500" /><line x1="800" y1="0" x2="800" y2="500" />
        <line x1="1000" y1="0" x2="1000" y2="500" /><line x1="1200" y1="0" x2="1200" y2="500" />
        <line x1="1400" y1="0" x2="1400" y2="500" />
        <line x1="0" y1="150" x2="1600" y2="150" /><line x1="0" y1="300" x2="1600" y2="300" />
    </g>

    <!-- Outer Perimeter Fence (Zone C - Wide 1600x500) -->
    <rect class="fence" x="40" y="30" width="1520" height="440" rx="8" />

    <!-- Title Header -->
    <text class="title" x="70" y="65">ZONE C : 외곽 시설물 경계 감시 구역 2D 지도</text>
    <text class="sub" x="70" y="88">구역 비례 크기: 1600 x 500 | 편심 자율주행, Spot 4족 보행, 실외 자율주행 로봇 경계 순찰 전용 구역</text>

    <!-- Patrol Route Waypoints -->
    <path class="route" d="M 80,140 L 1520,140 L 1520,380 L 80,380 Z" />

    <!-- Waypoints Circle Markers -->
    <circle class="wp" cx="80" cy="140" r="8" /><text class="sub" x="95" y="145" fill="#22c55e">Waypoint W1 (North-West)</text>
    <circle class="wp" cx="800" cy="140" r="8" /><text class="sub" x="815" y="145" fill="#22c55e">Waypoint W2 (North Center)</text>
    <circle class="wp" cx="1520" cy="140" r="8" /><text class="sub" x="1420" y="165" fill="#22c55e">Waypoint W3 (North-East)</text>
    <circle class="wp" cx="1520" cy="380" r="8" /><text class="sub" x="1420" y="405" fill="#22c55e">Waypoint W4 (South-East)</text>
    <circle class="wp" cx="800" cy="380" r="8" /><text class="sub" x="815" y="405" fill="#22c55e">Waypoint W5 (South Center)</text>
    <circle class="wp" cx="80" cy="380" r="8" /><text class="sub" x="95" y="405" fill="#22c55e">Waypoint W6 (South-West)</text>

    <!-- Guard Post & Charging Docks -->
    <rect class="post" x="700" y="210" width="200" height="100" rx="4" />
    <text class="title" x="715" y="245" font-size="14">외곽 초소 &amp; Spot 패드</text>
    <text class="sub" x="715" y="270">4족 보행 무선 충전 전용 스테이션</text>
</svg>
